<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1000" cy="150" r="300" fill="url(#glow)" opacity="0.15" filter="blur(60px)" />
  <circle cx="200" cy="500" r="250" fill="#3b82f6" opacity="0.1" filter="blur(50px)" />
  
  <!-- Badge -->
  <rect x="100" y="90" width="300" height="42" rx="21" fill="#ffffff" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.5" />
  <text x="250" y="117" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#a5b4fc" text-anchor="middle">🎓 MCA 学习力与自主学习系统</text>

  <!-- Title -->
  <text x="100" y="220" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="56" font-weight="800" fill="#ffffff">AI 提分叶路春｜个性化教育测评</text>

  <!-- Slogan -->
  <text x="100" y="295" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="32" font-weight="600" fill="#38bdf8">自主学习是学霸标配，自主学习 × AI 是学霸顶配</text>

  <!-- Feature Tags -->
  <g transform="translate(100, 360)">
    <rect x="0" y="0" width="220" height="50" rx="12" fill="#ffffff" fill-opacity="0.08" />
    <text x="110" y="32" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" fill="#e2e8f0" text-anchor="middle">⚡ 学生 MBTI 测评</text>

    <rect x="240" y="0" width="220" height="50" rx="12" fill="#ffffff" fill-opacity="0.08" />
    <text x="350" y="32" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" fill="#e2e8f0" text-anchor="middle">🎯 学习动机自驱力</text>

    <rect x="480" y="0" width="220" height="50" rx="12" fill="#ffffff" fill-opacity="0.08" />
    <text x="590" y="32" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" fill="#e2e8f0" text-anchor="middle">🧠 VARK 认知通道</text>

    <rect x="720" y="0" width="220" height="50" rx="12" fill="#ffffff" fill-opacity="0.08" />
    <text x="830" y="32" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="20" fill="#e2e8f0" text-anchor="middle">🤝 家长协同引导</text>
  </g>

  <!-- Footer Info -->
  <line x1="100" y1="480" x2="1100" y2="480" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
  <text x="100" y="535" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="500" fill="#94a3b8">由叶路春老师创办 · 中高考学情诊断与自驱力激发</text>
  <text x="1100" y="535" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="24" font-weight="700" fill="#6366f1" text-anchor="end">https://aitifen.cc</text>
</svg>
